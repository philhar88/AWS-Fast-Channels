# Catalog genre tags -> IAB Tech Lab Content Taxonomy 3.1, through the IAB CTV Genre Mapping (ATTRIBUTION.md).
#
# [ctv] is the CTV Genre Mapping as IAB Tech Lab publishes it: each CTV genre and its Content Taxonomy 3.1 unique id
# (a string: some ids are alphanumeric). The comment is the id's name in Content Taxonomy 3.1.
# [tags] maps each lower-case catalog genre tag (ContentItem.genres) to a CTV genre. Add your own tags here, and only
# here. A tag that is not listed is not a genre: the catalog context object carries it in kwarray.
#
# Loading fails on an id that is not in ct31-ids.txt, a tag that names no CTV genre, and a tag that is not lower case.

[ctv]
"Action" = "325"  # Action/Adventure
"Adventure" = "325"  # Action/Adventure
"Animals" = "422"  # Pets
"Animation" = "641"  # Animation & Anime
"Anime" = "641"  # Animation & Anime
"Arts" = "201"  # Fine Art
"Automotive" = "1"  # Automotive
"Awards" = "162"  # Awards Shows
"Biography" = "44"  # Biographies
"Business & Finance" = "52"  # Business and Finance
"Children" = "645"  # Family/Children
"Comedy" = "646"  # Comedy
"Cooking" = "216"  # Cooking
"Crime" = "KHPC5A"  # True Crime
"Documentary" = "332"  # Documentary
"Drama" = "647"  # Drama
"Education" = "132"  # Education
"Family" = "645"  # Family/Children
"Fantasy" = "335"  # Fantasy
"Game Show" = "JLBCU7"  # Entertainment
"Gaming" = "680"  # Video Gaming
"History" = "EZWB7V"  # History
"Hobbies" = "239"  # Hobbies & Interests
"Holidays" = "649"  # Holiday
"Home & Garden" = "274"  # Home & Garden
"Horror" = "336"  # Horror
"Law" = "383"  # Law
"Mystery" = "331"  # Mystery
"News" = "1020"  # News (a descriptive vector: Content Purpose > Informational > News)
"Outdoors" = "159"  # Outdoor Activities
"Paranormal" = "244"  # Paranormal Phenomena
"Politics" = "386"  # Politics
"Reality" = "651"  # Reality TV
"Religion" = "453"  # Religion & Spirituality
"Romance" = "326"  # Romance
"Sci-Fi" = "652"  # Science Fiction
"Sitcom" = "646"  # Comedy
