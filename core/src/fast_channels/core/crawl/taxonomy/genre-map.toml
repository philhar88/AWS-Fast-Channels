"Sports" = "483"  # Sports
"Thriller" = "700"  # Thriller
"War" = "389"  # War and Conflicts
"Weather" = "390"  # Weather
"Western" = "KHPC6A"  # Western
"Young Adult" = "51"  # Young Adult

