# --- Audio (AAC stereo 48 kHz CBR) ---------------------------------------------------------------------------
[[audio]]
group_id = "aac-lc-128"
profile = "lc"
kbps = 128

[[audio]]
group_id = "aac-he1-64"
profile = "he1"
kbps = 64

[[audio]]
group_id = "aac-he2-32"
profile = "he2"
kbps = 32
