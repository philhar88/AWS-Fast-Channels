# STANDARD: the default FAST ladder. Plain HLS: H.264 High 8-bit with AAC-LC 128 kbit/s stereo muxed into every
# variant's MPEG-TS segments, 29.97 fps, 2 s GOP, 6 s segments, MediaConvert Basic tier.
# Order is multivariant order: the 720p rung first, so players start mid-ladder, then 1080p and 360p.
# QVBR level / max_kbps are the MediaConvert inputs; hrd_kbps = max_kbps on rungs <= 432p holds peaks at the cap.

id = "standard"
description = "AVC + AAC-LC muxed in MPEG-TS, up to 1080p, 29.97 fps"
frame_rate = "29.97"
gop_seconds = 2
segment_seconds = 6

[options]
allow_frame_rate_conversion = false

[audio]
kbps = 128

[[video]]  # start-up variant
name = "avc-720p"
width = 1280
height = 720
qvbr = 7
max_kbps = 3400

[[video]]
name = "avc-1080p"
width = 1920
height = 1080
qvbr = 8
max_kbps = 6000

[[video]]
name = "avc-360p"
width = 640
height = 360
qvbr = 6
max_kbps = 800
hrd_kbps = 800
