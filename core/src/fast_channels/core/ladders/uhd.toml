# UHD: premium 4K ladder (ladders.md §4.4). AVC 8 (as STANDARD) + HEVC Main10 7 + AV1 10-bit 7 + AAC 4,
# 29.97 fps, 2 s GOP, 6 s segments. Order is multivariant order: AVC 720p first, AVC descending, HEVC, AV1.
# Apple 1.34: some UHD variant <= 15 Mbit/s (hevc-2160p-a); AAC-LC 160 is Apple's top stereo bitrate (2.9).

id = "uhd"
description = "AVC to 1080p, HEVC Main10 and AV1 10-bit to 2160p, 29.97 fps"
frame_rate = "29.97"
gop_seconds = 2
segment_seconds = 6

[options]
iframe_playlists = false
loudness_lkfs = -24.0
acceleration = "PREFERRED"
film_grain = false
allow_frame_rate_conversion = false

# --- AVC (H.264 High, 8-bit, avc1) ---------------------------------------------------------------------------
[[video]]  # A5: default variant
name = "avc-720p-a"
codec = "avc"
width = 1280
height = 720
qvbr = 7
max_kbps = 3400
audio_group = "aac-lc-128"

