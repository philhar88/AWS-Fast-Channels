[project]
name = "fast-channels-core"
version = "3.0.0"
description = "Pure domain model for FAST channels: ladders, rendition profiles, timelines, manifests, MediaTailor specs."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fast_channels.core"

