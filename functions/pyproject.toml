[project]
name = "fast-channels-functions"
version = "3.0.0"
description = "AWS Lambda handlers: ingest pipeline steps, agent tools, custom resources."
requires-python = ">=3.14"
dependencies = [
    "fast-channels-core",
    "aws-lambda-powertools[parser]>=3.36,<4",
    # The Lambda runtime's SDK lags: its Elemental Inference model has no smart subtitles (observed 2026-10).
    "boto3>=1.43.114",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fast_channels.functions"

[tool.uv.sources]
fast-channels-core = { workspace = true }
