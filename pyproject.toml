[project]
name = "fast-channels"
version = "3.0.0"
description = "FAST Channels on AWS: a reference architecture for agent-scheduled, ad-supported linear channels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "functions", "agent", "infra"]

[dependency-groups]
dev = [
    "boto3>=1.42",
    "boto3-stubs[bedrock-agentcore,bedrock-agentcore-control,cloudformation,cognito-idp,dynamodb,events,logs,mediaconvert,mediatailor,s3,scheduler,ssm,stepfunctions]>=1.42",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7",
    "ruff>=0.14",
    "syrupy>=4.9",
]
docs = [
    "diagrams>=0.25",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["cdk.out", "console", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PTH", "PL", "PERF", "TC", "N", "ASYNC", "S", "LOG", "G"]
ignore = ["PLR0913", "PLR2004", "S101", "S105", "TC003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["fast_channels"]

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["core/src", "functions/src", "agent/src", "infra/src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "constructs.*", "cdk_nag.*", "jsii.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
consider_namespace_packages = true
testpaths = ["core/tests", "functions/tests", "agent/tests", "infra/tests"]
markers = ["e2e: deployed end-to-end tests (require AWS credentials and a deployed stage)"]
