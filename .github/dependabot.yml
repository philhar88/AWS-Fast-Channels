version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      aws-cdk: { patterns: ["aws-cdk-lib", "constructs", "cdk-nag"] }
      agents: { patterns: ["strands-agents*", "bedrock-agentcore*", "ag-ui-*", "aws-opentelemetry-distro", "mcp"] }
      python-tooling: { patterns: ["ruff", "mypy", "pytest*", "syrupy", "boto3-stubs*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: develop
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    groups:
      cloudscape: { patterns: ["@cloudscape-design/*"] }
      build-tooling: { patterns: ["vite*", "@vitejs/*", "typescript*", "eslint*", "@eslint/*", "typescript-eslint", "vitest", "@playwright/*"] }
    ignore:
      # typescript-eslint 8.x supports TypeScript below 6.1 only (its peer range), so a group with TypeScript 7 cannot
      # install. Lift this once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /pds
    schedule: { interval: weekly, day: monday }
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: develop
    groups:
      actions: { patterns: ["*"] }
