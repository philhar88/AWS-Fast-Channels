name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include error messages and the correlation id from the logs if you have one. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce, description: Configuration overrides, commands, prompts. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: v3.0.0 }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ingest and encoding, Channel Assembly, Ad insertion (SSAI/SGAI), Delivery (CloudFront), Agent and tools, Console, Deployment, Documentation]
    validations: { required: true }
