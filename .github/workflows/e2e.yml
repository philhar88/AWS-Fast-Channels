name: End-to-end (deploy, test, destroy)

# Manual: deploys a throwaway stage into the AWS account behind the OIDC role, runs tests/e2e against it and tears it
# down. Required before tagging a release (see CONTRIBUTING.md). Costs a few US dollars per run.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Deployment prefix (resource names start with it)
        default: fastci
        required: true
      keep:
        description: Keep the stage after the tests (for debugging)
        type: boolean
        default: false
      leg:
        description: "v3: the v3.0.0 leg; demand: the demand path (fastci with ops, demand, pds, release and crawl)"
        type: choice
        options: [v3, demand]
        default: v3

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-${{ inputs.prefix }}

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # The input reaches the shell only through this variable, never interpolated into a script.
  PREFIX: ${{ inputs.prefix }}
  # The agent test signs in as the autopilot's machine client, which exists only for a channel with an autopilot
  # schedule. This one fires once a year (1 January, 00:00 UTC), not during a test run.

jobs:
  e2e:
    if: inputs.leg == 'v3'
    runs-on: ubuntu-24.04-arm
    environment: e2e
    timeout-minutes: 120
    steps:
      - name: Check the prefix
        run: |
          pattern='^[a-z][a-z0-9]{1,15}$'  # FastChannelsConfig.prefix (core.naming.PREFIX_PATTERN): no hyphen
          [[ "$PREFIX" =~ $pattern ]] || { echo "::error::the prefix input must match $pattern"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --all-packages && npm ci && (cd console && npm ci && npm run build)
      - name: Deploy
        run: >-
          npx cdk deploy '**' --require-approval never --concurrency 2
          -c "fast-channels.prefix=$PREFIX" -c fast-channels.agent.machine_client=true
      - name: End-to-end tests
        run: uv run pytest tests/e2e -m e2e --prefix "$PREFIX" -v
      - name: Destroy
        if: always() && !inputs.keep
        run: npx cdk destroy '**' --force -c "fast-channels.prefix=$PREFIX"

  # The demand path (BUILD-PLAN §12.3 e2e-demand): the stage's repository stacks with ops, demand, pds, release and
  # crawl, the Prebid Server guidance on its own bootstrap, the synthetic edge tests, the release and crawl modules'
  # tests, then viewers on the channel's stable sibling through MediaTailor, Prebid Server and the Pod Decision Service
  # (test_14_demand_pods.py); then everything destroyed and inventoried. Costs about US$3-5 per run.
  e2e-demand:
    if: inputs.leg == 'demand'
    runs-on: ubuntu-24.04-arm
    environment: e2e
    timeout-minutes: 240
    env:
      MODULES: ops,demand,pds,release,crawl
    steps:
      - name: Check the prefix
        run: |
          pattern='^[a-z][a-z0-9]{1,9}$'  # FastChannelsConfig.prefix, at most 10 with demand
          [[ "$PREFIX" =~ $pattern ]] || { echo "::error::the prefix input must match $pattern"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --all-packages && npm ci
      - name: Deploy the stage
        run: make deploy STAGE=fastci MODULES="$MODULES" PREFIX="$PREFIX"
      - name: Deploy the demand module
        run: make deploy-demand STAGE=fastci MODULES="$MODULES" PREFIX="$PREFIX"
      - name: Demand tests
        run: >-
          uv run pytest tests/e2e/test_11_demand_edge.py tests/e2e/test_12_release.py tests/e2e/test_13_crawl.py
          tests/e2e/test_14_demand_pods.py -m e2e --prefix "$PREFIX" -v
      - name: Destroy the demand module
        if: always() && !inputs.keep
        run: make destroy-demand STAGE=fastci MODULES="$MODULES" PREFIX="$PREFIX"
      - name: Destroy the stage
        if: always() && !inputs.keep
        run: |
          make destroy STAGE=fastci MODULES="$MODULES" PREFIX="$PREFIX"
          uv run python scripts/ledger_verify.py purge --prefix "$PREFIX" --apply --bypass-governance
      - name: Inventory
        if: always() && !inputs.keep
        run: |
          uv run python scripts/cleanup.py --prefix "$PREFIX"
          uv run python scripts/prebid_guidance.py inventory --stage fastci --modules "$MODULES" --prefix "$PREFIX"
