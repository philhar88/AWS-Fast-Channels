name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  AWS_REGION: us-east-1

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04-arm # arm64, like the Lambda functions and the AgentCore runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The offline tests of tests/e2e render the release gate's synthetic source with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --all-packages
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy core/src functions/src agent/src infra/src
      - name: mypy scripts tests/e2e
        run: uv run mypy scripts tests/e2e
        env:
          MYPYPATH: scripts:tests/e2e # their modules import scripts/_stack.py and tests/e2e/harness.py by name
      - name: mypy tests/pbs
        run: uv run mypy tests/pbs
        env:
          MYPYPATH: tests/pbs # its own conftest.py, so checked apart from tests/e2e
      # Every package's tests, plus the offline tests of tests/e2e and scripts/ (pytest testpaths; marker "not e2e").
      - run: uv run pytest --cov=fast_channels --cov-report=term-missing:skip-covered
      - name: No unfilled release placeholders in the docs
        run: "! git grep -nE '\\{\\{[A-Z_]+\\}\\}' -- '*.md'"

  guidance-overlays:
    name: Prebid Server guidance overlays
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      # Fetches the guidance at the pinned tag and fails if the tag moved, a pinned upstream file changed or a patch no
      # longer applies (vendor/prebid-guidance/PIN.toml).
      - name: Apply the overlays to the pinned guidance
        run: uv run python scripts/prebid_guidance.py apply
      - name: Overlay tests on the patched guidance
        run: uv run pytest tests/e2e/test_prebid_guidance.py -v

  pbs-module:
    name: Prebid Server module (JUnit, contract tests)
    runs-on: ubuntu-24.04 # x86, like the Prebid Server image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "21" # Prebid Server Java 3.43.0
          cache: maven
          cache-dependency-path: vendor/prebid-guidance/PIN.toml # the Prebid Server Java release is pinned there
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      # The guidance's Dockerfile build stage, natively: the pinned Prebid Server Java tag (refused unless it resolves
      # to the commit in vendor/prebid-guidance/PIN.toml), the guidance's extra modules and ours, its Maven options.
      - name: Build Prebid Server Java with the module
        run: uv run python scripts/pbs_module.py build
      - name: Module unit tests (JUnit)
        run: uv run python scripts/pbs_module.py test
      - name: Contract tests against the jar (no-hook matrix, header isolation, wire fields, impressions)
        run: uv run pytest tests/pbs -m pbs -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pbs-module-reports
          path: |
            build/pbs/*/test-reports
            /tmp/pytest-of-*/**/pbs.log
          retention-days: 7

  console:
    name: Console (lint, types, tests, build)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-dist
          path: console/dist
          retention-days: 7

  synth:
    name: CDK synth (cdk-nag)
    runs-on: ubuntu-24.04-arm
    needs: [console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: console/dist
      - run: uv sync --locked --all-packages
      - run: npm ci
      # cdk-nag and the CloudFormation validation rules run during synth and fail the build on findings of the
      # selected stacks: without '**' no stage stack is selected and findings pass silently.
      - run: npx cdk synth '**' --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
