name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  AWS_REGION: us-east-1

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04-arm # arm64, like the Lambda functions and the AgentCore runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The offline tests of tests/e2e render the release gate's synthetic source with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --all-packages
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy core/src functions/src agent/src infra/src
      - name: mypy scripts tests/e2e
        run: uv run mypy scripts tests/e2e
        env:
          MYPYPATH: scripts:tests/e2e # their modules import scripts/_stack.py and tests/e2e/harness.py by name
      # Every package's tests, plus the offline tests of tests/e2e and scripts/ (pytest testpaths; marker "not e2e").
      - run: uv run pytest --cov=fast_channels --cov-report=term-missing:skip-covered
      - name: No unfilled release placeholders in the docs
        run: "! git grep -nE '\\{\\{[A-Z_]+\\}\\}' -- '*.md'"

  console:
    name: Console (lint, types, tests, build)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-dist
          path: console/dist
          retention-days: 7

  synth:
    name: CDK synth (cdk-nag)
    runs-on: ubuntu-24.04-arm
    needs: [console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: console/dist
      - run: uv sync --locked --all-packages
      - run: npm ci
      # cdk-nag and the CloudFormation validation rules run during synth and fail the build on findings of the
      # selected stacks: without '**' no stage stack is selected and findings pass silently.
      - run: npx cdk synth '**' --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
