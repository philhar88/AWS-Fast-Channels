[project]
name = "fast-channels-agent"
version = "3.0.0"
description = "Amazon Bedrock AgentCore Runtime app: the FAST channel scheduling agent (Strands Agents)."
requires-python = ">=3.14"
dependencies = ["strands-agents>=1.61,<2", "bedrock-agentcore>=1.24,<2", "aws-opentelemetry-distro>=0.21", "ag-ui-protocol>=1.0,<2", "httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fast_channels.agent"

