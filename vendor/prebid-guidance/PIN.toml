# SHA-256 of upstream files the overlays and the rendered configuration rely on without patching them: the
# configuration layering (bootstrap.sh copies current/ over default/), the defaults that core/pbs_config.py repeats,
# the build configuration the image build replaces for other releases, the amt adapter configuration that
# amt-bidder/pbs-4/ ports to 4.x, and the deploy-time upload of the configuration directories. With the PDS on,
# scripts/guidance_app.py relies on the stack class build_app instantiates (prebid_server_stack.py), the task
# definitions' ids and Prebid Server's container (ecs_task_construct.py, in both entry deployments) and the task size
# it overrides (stack_constants.py); app.py and cloudfront_entry_deployment.py are pinned above.
