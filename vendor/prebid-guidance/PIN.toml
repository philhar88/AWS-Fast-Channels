# The Guidance for Deploying a Prebid Server on AWS, pinned for the demand module (docs/demand.md, ADR-0020).
#
# scripts/prebid_guidance.py checks the guidance out at `commit` into build/prebid-guidance/ (never committed),
# refuses it unless `tag` resolves to `commit` and every file below still has its SHA-256, then applies the overlays
# in order. To move the pin: change tag and commit, run `prebid_guidance.py verify`, review every file it reports
# against the overlays, regenerate the patches if needed and update the hashes.

[guidance]
repository = "https://github.com/aws-solutions-library-samples/prebid-server-deployment-on-aws"
tag = "v1.4.0"
commit = "0c7e7e714de37d1f56b29219d7ad9e6d17fac6b2"
license = "Apache-2.0"

# Prebid Server Java releases the image is built from. The guidance's docker-build-config.json names the tag
# (GIT_TAG_VERSION); scripts/pbs_module.py and the image build refuse a tag that does not resolve to its commit here.
[pbs_java]
repository = "https://github.com/prebid/prebid-server-java"

[pbs_java.commits]
"3.43.0" = "ba7f97e33fe1dcc5e64f926bc8bea5d4d4252fc1"
"4.4.0" = "de50af1076d9cf8375c4af4fa1adcfff96db2c7c"

# Releases the guidance does not build (its docker-build-config.json names 3.43.0 and pins 3.x dependencies:
# Vert.x 4, Spring Boot 3): the JDK major version (overlay O6's build argument) and the Maven options. A stage
# selects one with modules.demand.pbs_version; the image build writes a docker-build-config.json for it.
[pbs_java.builds."4.4.0"]
jdk = "25"
mvn_options = "-Dmaven.test.skip -Dcheckstyle.skip"

# The JDKs scripts/pbs_module.py downloads (checksum-verified) when the one on PATH is another major version.
[jdks."25".linux-x86_64]
url = "https://corretto.aws/downloads/resources/25.0.5.0.10/amazon-corretto-25.0.5.0.10-linux-x64.tar.gz"
sha256 = "1d89b4194f20ee513f4dd9fc2aadd038de3c713c37fd444d77566b3da7b0ee65"

[jdks."25".linux-aarch64]
url = "https://corretto.aws/downloads/resources/25.0.5.0.10/amazon-corretto-25.0.5.0.10-linux-aarch64.tar.gz"
sha256 = "8dc8e5379959c0814e99785b53657c35800b74950fc9fa39738d26153b62ef6c"

# Applied in this order. `files` are copied from this directory into the checkout (repository-relative source =
# checkout-relative destination).
[[overlays]]
id = "O1"
title = "Stack-name prefix (stack and Glue database names) and a dedicated CDK bootstrap"
patch = "patches/O1-app-prefix-bootstrap.patch"

[[overlays]]
id = "O2"
title = "A customer WAF rule group referenced first by the guidance's web ACL"
patch = "patches/O2-extra-waf-rule-group.patch"

[[overlays]]
id = "O4"
title = "The fast-ctv module compiled through the guidance's amt-bidder injection point"
patch = "patches/O4-fast-ctv-module.patch"
files = { "amt-bidder/copy-fast-ctv.sh" = "source/loadtest/amt-bidder/copy-fast-ctv.sh", "amt-bidder/pbs-4/AmtConfiguration.java" = "source/loadtest/amt-bidder/pbs-4/AmtConfiguration.java" }

[[overlays]]
id = "O5"
title = "Bidder simulator creatives from configuration"
patch = "patches/O5-simulator-creatives.patch"

[[overlays]]
id = "O6"
title = "The JDK of the Prebid Server Java build is a build argument"
patch = "patches/O6-pbs-java-version.patch"

[[overlays]]
id = "O7"
title = "ECS deployments keep 100% of the desired tasks healthy"
patch = "patches/O7-ecs-deployment.patch"

